name: Deploy

on:
    workflow_dispatch:
    # rebuild weekly so changes to the pinned repos on the GitHub profile show up
    schedule:
        - cron: '0 0 * * 1'
    push:
        branches:
            - main

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        permissions:
            contents: read
            deployments: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: ${{ runner.os }}-bun-

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build
              id: build
              run: bun run build
              env:
                  PUBLIC_GITHUB_USERNAME: ${{ github.repository_owner }}
                  PUBLIC_LASTFM_USERNAME: ${{ secrets.PUBLIC_LASTFM_USERNAME }}
                  PUBLIC_LASTFM_API_KEY: ${{ secrets.PUBLIC_LASTFM_API_KEY }}
                  PUBLIC_COUNTER_API_URL: ${{ secrets.PUBLIC_COUNTER_API_URL }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload static files
              id: deployment
              uses: actions/upload-pages-artifact@v5
              with:
                  path: build/

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
